- title: Selected Projects
  type: time_table
  contents:
    - title: Differential Privacy in Best-of-n Alignment
      institution: Prof. Sayak Ray Chowdhury, IIT Kanpur
      year: Jan 2026 - Present
      description:
        - Developed a privacy-preserving Gaussian-Max algorithm to control the KL-divergence penalty during LLM alignment.
        - Derived theoretical Win Rate and KL divergence for Gaussian-Max using multivariate probit integrals.
        - Validated the privacy-utility tradeoff on the Anthropic HH dataset, perfectly matching theoretical bounds.
    - title: Cancer Trial Design
      institution: Course Project — Prof. Dootika Vats, IIT Kanpur (Johnson & Johnson)
      year: Feb 2025 - Apr 2025
      description:
        - Identified clinically relevant mutations from large-scale cancer datasets using prevalence analysis and chi-squared hypothesis testing.
        - Designed survival trial simulations using Kaplan-Meier estimates and log-rank tests with staggered recruitment and dropouts.
        - Developed a Beta-Binomial Bayesian interim framework for early efficacy estimates and stopping criteria.
    - title: Approximate Bayesian Inference
      institution: Prof. Arnab Hazra, IIT Kanpur
      year: Jan 2025 - Apr 2025
      description:
        - Implemented a Bayesian inference technique for problems with intractable likelihood.
        - Analyzed limitations of existing methods like ABC and Bayesian Synthetic Likelihood (BSL), such as their reliance on thresholds.
        - Built an unbiased estimator of approximate likelihood using classification-based discrepancy and Hermite polynomial expansions.
        - Compared Expected Evaluation with true posterior estimates under varying MCMC iterations.
    - title: Stock Price Prediction
      institution: Course Project — Prof. Amit Mitra, IIT Kanpur
      year: Jan 2025 - Apr 2025
      description:
        - Predicted next day's high price of Nifty-50 stocks using past 10 days of open, close, low, volume, and turnover.
        - Applied de-trending, fitted ARIMA and GARCH models, and confirmed heteroskedasticity using the ARCH test.
        - Trained RNN, LSTM, GRU, and attention networks; the best model (GRU) achieved test MAPE of 0.0064%.
    - title: Abstractive Text Summarization
      institution: Prof. Subhajit Dutta, IIT Kanpur
      year: Jan 2024 - Apr 2024
      description:
        - Built a Seq2Seq LSTM encoder-decoder model for abstractive text summarization.
        - Implemented a preprocessing pipeline with text cleaning, tokenization, and Word2Vec embeddings.
        - Trained with RMSprop optimizer and Sparse Categorical Cross Entropy loss.

